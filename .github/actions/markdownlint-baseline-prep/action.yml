name: Markdownlint baseline prep
description: Collect changed Markdown, run markdownlint, normalize findings, invoke gate script
inputs:
  markdownlint-baseline-path:
    description: Baseline JSON path for the gate script
    required: false
    default: ''
  markdownlint-gate-script:
    description: Repository-relative gate script path
    required: false
    default: ''
  markdownlint-config:
    description: markdownlint config path
    required: false
    default: '.markdownlint.json'
  github-event-name:
    description: github.event_name
    required: true
  github-event-before:
    description: github.event.before
    required: false
    default: ''
  github-pr-base-sha:
    description: github.event.pull_request.base.sha
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Run markdownlint baseline gate
      shell: bash
      run: "${GITHUB_ACTION_PATH}/run.sh"
      env:
        MARKDOWNLINT_BASELINE_PATH: ${{ inputs.markdownlint-baseline-path }}
        MARKDOWNLINT_GATE_SCRIPT: ${{ inputs.markdownlint-gate-script }}
        MARKDOWNLINT_CONFIG: ${{ inputs.markdownlint-config }}
        GITHUB_EVENT_NAME: ${{ inputs.github-event-name }}
        GITHUB_EVENT_BEFORE: ${{ inputs.github-event-before }}
        GITHUB_PR_BASE_SHA: ${{ inputs.github-pr-base-sha }}
