name: markdownlint-baseline-selftest

on:
  pull_request:
    paths:
      - '.github/actions/markdownlint-baseline-prep/**'
      - '.github/workflows/aevion-lint.yml'
      - '.github/workflows/markdownlint-baseline-selftest.yml'
      - 'scripts/ci/test-markdownlint-baseline-lib.sh'

jobs:
  lib-selftest:
    name: Markdownlint baseline step logic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run lib self-test
        run: bash scripts/ci/test-markdownlint-baseline-lib.sh
