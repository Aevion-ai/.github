name: aevion-lint

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use for Python lint jobs'
        type: string
        default: '3.12'
      markdownlint-config:
        description: 'Path to markdownlint config file'
        type: string
        default: '.markdownlint.json'
      markdownlint-baseline-enabled:
        description: 'Opt in: lint changed Markdown only and gate new findings against a baseline'
        type: boolean
        default: false
      markdownlint-gate-script:
        description: 'Repository-relative script that fails only on new markdownlint findings vs the baseline'
        type: string
        default: ''
      markdownlint-baseline-path:
        description: 'Path to committed markdownlint baseline JSON consumed by the gate script'
        type: string
        default: ''
      markdownlint-cli-version:
        description: 'Optional markdownlint-cli npm version (e.g. 0.43.0); empty installs latest as today'
        type: string
        default: ''
      bandit-baseline-path:
        description: 'Opt in: bandit -b baseline JSON path; empty runs bandit without a baseline file'
        type: string
        default: ''
      pytest-paths:
        description: 'Opt in: pytest path arguments; empty skips the pytest job'
        type: string
        default: ''
      pytest-pythonpath:
        description: 'PYTHONPATH for the optional pytest job'
        type: string
        default: ''
      pytest-extra-packages:
        description: 'Extra pip packages for the optional pytest job (space-separated)'
        type: string
        default: ''
      strict-all-clear:
        description: 'Opt in: all-clear fails when any needed job failed or was cancelled'
        type: boolean
        default: false

jobs:
  detect:
    name: Detect file types
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.check.outputs.python }}
      rust: ${{ steps.check.outputs.rust }}
      markdown: ${{ steps.check.outputs.markdown }}
      shell: ${{ steps.check.outputs.shell }}
      yaml: ${{ steps.check.outputs.yaml }}
      js: ${{ steps.check.outputs.js }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Detect languages
        id: check
        run: |
          python_present=false
          rust_present=false
          markdown_present=false
          shell_present=false
          yaml_present=false
          js_present=false

          if find . -name '*.py' -print -quit | grep -q .; then python_present=true; fi
          if [ -f Cargo.toml ]; then rust_present=true; fi
          if find . -name '*.md' -print -quit | grep -q .; then markdown_present=true; fi
          if find . -name '*.sh' -print -quit | grep -q .; then shell_present=true; fi
          if find . \( -name '*.yml' -o -name '*.yaml' \) -print -quit | grep -q .; then yaml_present=true; fi
          if [ -f package.json ] || find . \( -name '*.js' -o -name '*.ts' \) -print -quit | grep -q .; then js_present=true; fi

          echo "python=$python_present" >> "$GITHUB_OUTPUT"
          echo "rust=$rust_present" >> "$GITHUB_OUTPUT"
          echo "markdown=$markdown_present" >> "$GITHUB_OUTPUT"
          echo "shell=$shell_present" >> "$GITHUB_OUTPUT"
          echo "yaml=$yaml_present" >> "$GITHUB_OUTPUT"
          echo "js=$js_present" >> "$GITHUB_OUTPUT"

  python-lint:
    name: Python lint
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install tools
        run: pip install ruff bandit
      - name: Run ruff
        run: ruff check .
      - name: Run bandit
        run: |
          if [ -n "${{ inputs.bandit-baseline-path }}" ]; then
            bandit -r . --skip B101 -b "${{ inputs.bandit-baseline-path }}"
          else
            bandit -r . --skip B101
          fi

  markdown-lint:
    name: Markdown lint
    needs: detect
    if: needs.detect.outputs.markdown == 'true' && inputs.markdownlint-baseline-enabled != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli
      - name: Run markdownlint
        run: |
          if [ -f "${{ inputs.markdownlint-config }}" ]; then
            markdownlint '**/*.md' --config "${{ inputs.markdownlint-config }}"
          else
            markdownlint '**/*.md'
          fi

  markdown-lint-baseline:
    name: Markdown lint (baseline gate)
    needs: detect
    if: needs.detect.outputs.markdown == 'true' && inputs.markdownlint-baseline-enabled == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
      - name: Install markdownlint-cli
        run: |
          if [ -n "${{ inputs.markdownlint-cli-version }}" ]; then
            npm install -g "markdownlint-cli@${{ inputs.markdownlint-cli-version }}"
          else
            npm install -g markdownlint-cli
          fi
      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
      - name: Run markdownlint baseline gate
        env:
          MARKDOWNLINT_BASELINE_PATH: ${{ inputs.markdownlint-baseline-path }}
          MARKDOWNLINT_GATE_SCRIPT: ${{ inputs.markdownlint-gate-script }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            fi
          fi
          mapfile -t changed_md < <(git diff --name-only --diff-filter=ACMR "${base}" HEAD -- '*.md' || true)
          if [ "${#changed_md[@]}" -eq 0 ]; then
            echo "No changed Markdown files to lint."
            exit 0
          fi
          config="${{ inputs.markdownlint-config }}"
          config_args=()
          if [ -f "${config}" ]; then
            config_args+=(--config "${config}")
          fi
          findings="$(mktemp)"
          set +e
          markdownlint "${changed_md[@]}" "${config_args[@]}" --json > "${findings}"
          markdownlint_status=$?
          set -e
          echo "markdownlint exit status: ${markdownlint_status}"
          gate="${{ inputs.markdownlint-gate-script }}"
          if [ -z "${gate}" ]; then
            echo "::error::markdownlint-gate-script is required when markdownlint-baseline-enabled is true"
            exit 1
          fi
          if [ ! -f "${gate}" ]; then
            echo "::error::markdownlint gate script not found: ${gate}"
            exit 1
          fi
          chmod +x "${gate}"
          "${gate}" "${{ inputs.markdownlint-baseline-path }}" "${findings}"

  shell-lint:
    name: Shell lint
    needs: detect
    if: needs.detect.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: find . -name '*.sh' -print0 | xargs -0 shellcheck

  yaml-lint:
    name: YAML lint
    needs: detect
    if: needs.detect.outputs.yaml == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        run: |
          if [ -f .yamllint ]; then
            yamllint .
          else
            yamllint .
          fi

  rust-lint:
    name: Rust lint
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@11df97af8e8102fd60b60a77dfbf58d40cd843b8 # v1.10.1
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  js-lint:
    name: JS/TS lint
    needs: detect
    if: needs.detect.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
      - name: Check for ESLint config
        id: eslint-config
        run: |
          if find . \( -name '.eslintrc*' -o -name 'eslint.config.*' \) -print -quit | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run ESLint
        if: steps.eslint-config.outputs.exists == 'true'
        run: npx eslint . --ext .js,.jsx,.ts,.tsx

  pytest:
    name: Pytest
    needs: detect
    if: needs.detect.outputs.python == 'true' && inputs.pytest-paths != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install pytest dependencies
        run: |
          pip install pytest
          if [ -n "${{ inputs.pytest-extra-packages }}" ]; then
            # shellcheck disable=SC2086
            pip install ${{ inputs.pytest-extra-packages }}
          fi
      - name: Run pytest
        env:
          PYTHONPATH: ${{ inputs.pytest-pythonpath }}
        run: |
          # shellcheck disable=SC2086
          pytest ${{ inputs.pytest-paths }}

  all-clear:
    name: All lint jobs passed
    needs:
      - detect
      - python-lint
      - markdown-lint
      - markdown-lint-baseline
      - shell-lint
      - yaml-lint
      - rust-lint
      - js-lint
      - pytest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report status
        if: inputs.strict-all-clear != true
        run: echo "All lint jobs passed"
      - name: Evaluate needed job results
        if: inputs.strict-all-clear == true
        run: |
          set -euo pipefail
          failed=0
          check() {
            local name="$1"
            local result="$2"
            echo "${name}=${result}"
            case "${result}" in
              success|skipped)
                ;;
              *)
                echo "::error::Lint gate failed: ${name} result=${result}"
                failed=1
                ;;
            esac
          }
          check detect "${{ needs.detect.result }}"
          check python-lint "${{ needs.python-lint.result }}"
          check markdown-lint "${{ needs.markdown-lint.result }}"
          check markdown-lint-baseline "${{ needs.markdown-lint-baseline.result }}"
          check shell-lint "${{ needs.shell-lint.result }}"
          check yaml-lint "${{ needs.yaml-lint.result }}"
          check rust-lint "${{ needs.rust-lint.result }}"
          check js-lint "${{ needs.js-lint.result }}"
          check pytest "${{ needs.pytest.result }}"
          if [ "${failed}" -ne 0 ]; then
            echo "One or more lint jobs failed or were cancelled (skipped is allowed)."
            exit 1
          fi
          if [ "${{ needs.detect.result }}" != "success" ]; then
            echo "detect must succeed; got ${{ needs.detect.result }}"
            exit 1
          fi
          echo "All lint jobs passed (or were correctly skipped)."
